<head>

    <title>Тест 3.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

<body>

<div id="app">
    <div id="illustration"></div>
    <h2 id="question">Загрузка...</h2>

</div>

        <button id="unlockBtn" style="background: orange; color: black; padding: 20px;">ОТКРЫТЬ РАЗБОР (РЕКЛАМА)</button>
    </div>
    <div id="extendedResult" class="hidden">
        <pre id="extendedText"></pre>
    </div>
</div>
